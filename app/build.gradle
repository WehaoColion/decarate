// v2.23.2.17 - Add a bounded Android AI Agent workflow.
// v2.23.2.15 - Add local knowledge links, backlinks, tags and search.
// v2.23.2.14 - Open documents in editing mode; make preview an explicit choice.
// v2.23.2.13 - Center document text blocks while preserving caret relocation.
// v2.23.2.11 - Organize finance overview, review and forecast details.
// v2.23.2.10 - Integrate compact knowledge header and caret visibility.
// v2.23.2.9 - Expose legal analysis actions and bind explicit send consent.
// v2.23.2.8 - Recover invalidated Android legal analysis and preparation requests.
// v2.23.2.7 - Repair offline document loading and formula whitespace parsing.
// v2.23.2.5 - Separate direct AI questions from knowledge-source answers.
// v2.23.2.2 - Add DeepSeek configuration and explicit capability checks.
// v2.23.2 - Recover filtered knowledge pages and compact collection controls.
// v2.23.1.3 - Keep earlier update notes behind a history entrance and show update minutes.
// v2.23.1.2 - Copy Android update notes by tapping a paragraph or the full-version action.
// v2.23.1.1 - Sync final legal reports across paired account devices.
// v2.23 - Improve Android financial review and add legal risk clues.
// v2.22.49.13 - Preserve the note title and first body line above the keyboard.
// v2.22.49.12 - Improve note editor spacing and compact the keyboard toolbar.
// v2.22.49.11 - Speed up Android note draft and local snapshot saves.
// v2.22.49.7 - Cache canvas connections and limit gesture recomposition.
// v2.22.49.6 - Expose multi-canvas creation and selection on the canvas screen.
// v2.22.49.5 - Reduce note collection and canvas viewport overhead.
// v2.22.49.4 - Add account-scoped touch knowledge canvases with transactional Rust storage.
// v2.22.49.3 - Keep document text above the keyboard toolbar while editing.
// v2.22.49.1 - Repair timer phase reminders and alarm-volume playback.
// v2.22.49 - Batch snapshot reads and parallelize bounded startup verification.
// v2.22.48.1 - Stream verified startup snapshots without large JVM copies.
// v2.22.48 - Stop paused rest bells and reject stale phase reminders.
// v2.22.47 - Preserve and read structured knowledge pages from Windows.
// v2.22.45 - Reduce repeated verification and writes during local startup.
// v2.22.44 - Preserve knowledge pages when switching applications.
// v2.22.43 - Keep pause controls and timer card geometry stable.
// v2.22.38 - Build offline report fixes with the installed Cargo cache and formal APK only.
import java.util.Properties
import org.gradle.api.GradleException
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24'
}

repositories {
    google()
    mavenCentral()
}

def props = new Properties()
def signingFile = rootProject.file('release_signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { props.load(it) }
}
def signingPropertyNames = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasSigningProperties = signingPropertyNames.every { name ->
    props.getProperty(name)?.trim()
}
def signingStoreFile = hasSigningProperties
    ? rootProject.file(props.getProperty('storeFile').trim())
    : null
def hasSigning = hasSigningProperties && signingStoreFile.isFile()

def crate = rootProject.file('native/gridtimer_native')
def userHome = System.getProperty('user.home')
def rustToolchain = 'stable-x86_64-pc-windows-msvc'
def rustupCandidates = [
    System.getenv('RUSTUP_HOME'),
    new File(userHome, '.rustup').absolutePath,
    'C:\\tools\\rustup'
].findAll { it != null && !it.trim().isEmpty() }.unique()
def rustupHomeFile = rustupCandidates.collect { new File(it) }.find { home ->
    def toolchain = new File(home, "toolchains/${rustToolchain}")
    new File(toolchain, 'bin/cargo.exe').isFile() &&
        new File(toolchain, 'bin/rustc.exe').isFile() &&
        new File(toolchain, 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe').isFile()
}
if (rustupHomeFile == null) {
    throw new GradleException("No complete ${rustToolchain} toolchain was found")
}
def rustupHome = rustupHomeFile.absolutePath
def cargo = new File(rustupHomeFile, "toolchains/${rustToolchain}/bin/cargo.exe").absolutePath
def cargoHome = System.getenv('CARGO_HOME') ?: new File(userHome, '.cargo').absolutePath
def rustLinker = new File(rustupHomeFile, "toolchains/${rustToolchain}/lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe").absolutePath
def ndkDir = file('C:\\tools\\android-sdk\\ndk\\27.1.12297006')
def libPath = [
    'C:\\tools\\xwin\\crt\\lib\\x86_64',
    'C:\\tools\\xwin\\sdk\\lib\\ucrt\\x86_64',
    'C:\\tools\\xwin\\sdk\\lib\\um\\x86_64'
].join(File.pathSeparator)
def buildRoot = file('C:\\gt\\gridtimer-build')
def rustTmp = file('C:\\gt\\tmp')
def generatedSources = layout.buildDirectory.dir('generated/source/rustAndroid/main')
def generatedAndroidTestSources = layout.buildDirectory.dir('generated/source/rustAndroid/androidTest')
def generatedUnitTestSources = layout.buildDirectory.dir('generated/source/rustAndroid/test')
def rustJniLibs = layout.buildDirectory.dir('rustJniLibs')
def rustSourceInputs = fileTree(crate) {
    include 'Cargo.toml'
    include 'Cargo.lock'
    include 'src/**'
    exclude 'target/**'
    exclude 'target_*/**'
    exclude '.cargo_target_check/**'
}
def appSourceInputs = fileTree(file('src')) {
    include '**/*'
}

def runCargo = { args, targetDir ->
    if (!crate.exists()) throw new GradleException("Rust crate not found: ${crate.absolutePath}")
    rustTmp.mkdirs()
    targetDir.mkdirs()
    exec {
        workingDir crate
        environment 'CARGO_HOME', cargoHome
        environment 'RUSTUP_HOME', rustupHome
        environment 'RUSTUP_TOOLCHAIN', 'stable-x86_64-pc-windows-msvc'
        environment 'CARGO_TARGET_DIR', targetDir.absolutePath
        environment 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER', rustLinker
        environment 'TMP', rustTmp.absolutePath
        environment 'TEMP', rustTmp.absolutePath
        environment 'TMPDIR', rustTmp.absolutePath
        environment 'LIB', libPath
        environment 'ANDROID_NDK_HOME', ndkDir.absolutePath
        environment 'ANDROID_NDK_ROOT', ndkDir.absolutePath
        environment 'ANDROID_NDK', ndkDir.absolutePath
        commandLine([cargo, '--offline'] + args)
    }
}

def versionedArtifactBaseName = { variantName ->
    if (variantName != 'release') {
        throw new GradleException('Only the formal release APK is supported.')
    }
    return "tenfold_v${android.defaultConfig.versionName}"
}
android {
    namespace 'com.ofairyo.gridtimer'
    compileSdk 35
    // Instrument production persistence and JNI behavior against the signed
    // release variant. The final packaging pass runs clean + assembleRelease,
    // so no test/debug APK is retained as a deliverable.
    testBuildType 'release'
    defaultConfig {
        applicationId 'com.ofairyo.gridtimer'
        minSdk 26
        targetSdk 34
        versionCode 22289
        versionName '2.23.2.20'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders.xiaomiAppId = ''
        manifestPlaceholders.xiaomiBuildTypeDebug = 'true'
        vectorDrawables { useSupportLibrary true }
    }
    signingConfigs {
        if (hasSigning) release {
            storeFile signingStoreFile
            storePassword props.getProperty('storePassword')
            keyAlias props.getProperty('keyAlias')
            keyPassword props.getProperty('keyPassword')
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'string', 'app_name', '十倍率 Debug'
        }
        xiaomiDebug {
            initWith debug
            applicationIdSuffix ''
            versionNameSuffix '-xiaomiDebug'
        }
        release {
            minifyEnabled false
            manifestPlaceholders.xiaomiBuildTypeDebug = 'false'
            if (hasSigning) signingConfig signingConfigs.release
            vcsInfo { include = false }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-P', 'plugin:androidx.compose.compiler.plugins.kotlin:experimentalStrongSkipping=true'
        ]
        if (providers.gradleProperty('gridtimerComposeReports').orNull == 'true') {
            freeCompilerArgs += [
                '-P', "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${layout.buildDirectory.dir('reports/compose').get().asFile.absolutePath}",
                '-P', "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=${layout.buildDirectory.dir('reports/compose').get().asFile.absolutePath}"
            ]
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets.main {
        def x = generatedSources.get().asFile
        manifest.srcFile new File(x, 'AndroidManifest.xml')
        res.srcDir new File(x, 'res')
        java.srcDir x
        jniLibs.srcDir rustJniLibs
    }
    sourceSets.test { java.srcDir generatedUnitTestSources }
    sourceSets.androidTest {
        java.srcDir generatedAndroidTestSources
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (variant.buildType != 'release') variant.enable = false
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        outputFileName = "${versionedArtifactBaseName(variant.name)}.apk"
    }
}

def generateAndroidSourcesFromRust = tasks.register('generateAndroidSourcesFromRust') {
    inputs.files rustSourceInputs
    outputs.dir generatedSources
    outputs.dir generatedAndroidTestSources
    outputs.dir generatedUnitTestSources
    doLast {
        def out = generatedSources.get().asFile
        def androidTestOut = generatedAndroidTestSources.get().asFile
        if (out.exists()) out.deleteDir()
        if (androidTestOut.exists()) androidTestOut.deleteDir()
        out.mkdirs()
        androidTestOut.mkdirs()
        runCargo(
            [
                'run',
                '-q',
                '--bin',
                'gridtimer_sourcegen',
                '--',
                out.absolutePath,
                androidTestOut.absolutePath,
                generatedUnitTestSources.get().asFile.absolutePath
            ],
            new File(buildRoot, 'sourcegen')
        )
    }
}

tasks.withType(KotlinCompile).configureEach { dependsOn generateAndroidSourcesFromRust }

def buildRustNative = tasks.register('buildRustNative') {
    inputs.files rustSourceInputs
    outputs.dir rustJniLibs
    doLast {
        if (!ndkDir.exists()) throw new GradleException("Android NDK not found: ${ndkDir.absolutePath}")
        def out = rustJniLibs.get().asFile
        if (out.exists()) out.deleteDir()
        out.mkdirs()
        runCargo(['ndk', '-o', out.absolutePath, '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-t', 'x86_64', '-P', '26', 'build', '--release', '--lib'], new File(buildRoot, 'native'))
    }
}

def sourceAudit = tasks.register('sourceAudit') {
    inputs.files rustSourceInputs
    inputs.files appSourceInputs
    outputs.upToDateWhen { true }
    doLast {
        runCargo(['run', '-q', '--bin', 'gridtimer_source_audit'], new File(buildRoot, 'audit'))
    }
}

tasks.named('preBuild') { dependsOn generateAndroidSourcesFromRust, buildRustNative, sourceAudit }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task ->
        task.project == project && (task.name in ['bundleRelease', 'buildReleasePreBundle', 'signReleaseBundle'] ||
            task.name ==~ /package.*(Debug|AndroidTest|Bundle)/)
    }) {
        throw new GradleException('Only the signed formal release APK may be packaged; bundles and test/debug APKs are disabled.')
    }
    def releasePackageRequested = graph.allTasks.any { task ->
        task.project == project && task.name == 'packageRelease'
    }
    if (releasePackageRequested && !hasSigning) {
        throw new GradleException(
            'Formal release signing is required: verify release_signing.properties and its keystore path.'
        )
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'junit:junit:4.13.2'
}
