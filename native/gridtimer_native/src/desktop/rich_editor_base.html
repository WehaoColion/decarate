                if (isReadOnly) {
                    return;
                }
                try {
                    editor.focus({ preventScroll: true });
                } catch (error) {
                    editor.focus();
                }
                if (restoreSavedSelection) {
                    if (!restoreSelection()) {
                        placeCaretAtEnd();
                    }
                } else if (!rememberSelection()) {
                    placeCaretAtEnd();
                }
                rememberSelection();
                syncEmptyState();
                scheduleCaretIntoView();
            }

            function flushPendingPush() {
                pushTimer = 0;
                if (isReadOnly || suppressPush || isComposing || !pendingPushRequested) {
                    return;
                }
                const shouldNormalize = pendingPushNormalize;
                pendingPushRequested = false;
                pendingPushNormalize = false;
                pendingPushImmediate = false;
                pendingPushDelay = 180;
                if (shouldNormalize) {
                    normalizeMarkup();
                }
                rememberSelection();
                const plainText = buildPlainText();
                const htmlValue = plainText || hasDocumentImage() ? editor.innerHTML.trim() : '';
                if (htmlValue === lastPushedHtml && plainText === lastPushedPlainText) {
                    syncEmptyState(plainText);
                    scheduleCaretIntoView();
                    return;
                }
                lastPushedHtml = htmlValue;
                lastPushedPlainText = plainText;
                const payload = {
                    html: htmlValue,
                    plain_text: plainText
                };
                syncEmptyState(plainText);
                scheduleCaretIntoView();
                if (window.AndroidRichText && window.AndroidRichText.onContentChanged) {
                    window.AndroidRichText.onContentChanged(JSON.stringify(payload));
                }
            }

            function emitCommitSnapshot(requestId) {
                window.clearTimeout(pushTimer);
                pushTimer = 0;
                pendingPushRequested = false;
                pendingPushNormalize = false;
                pendingPushImmediate = false;
                pendingPushDelay = 180;
                normalizeMarkup();
                rememberSelection();
                const plainText = buildPlainText();
                const htmlValue = plainText || hasDocumentImage() ? editor.innerHTML.trim() : '';
                lastPushedHtml = htmlValue;
                lastPushedPlainText = plainText;
                const payload = {
                    html: htmlValue,
                    plain_text: plainText
                };
                syncEmptyState(plainText);
                scheduleCaretIntoView();
                if (window.AndroidRichText && window.AndroidRichText.onCommitSnapshot) {
                    window.AndroidRichText.onCommitSnapshot(String(requestId), JSON.stringify(payload));
                }
            }

            function requestCommitSnapshot(requestId) {
                const safeRequestId = String(requestId || '');
                if (!safeRequestId) {
                    return;
                }
                window.clearTimeout(pushTimer);
                pushTimer = 0;
                if (!isComposing) {
                    emitCommitSnapshot(safeRequestId);
                    return;
                }
                editor.blur();
                let remainingCompositionChecks = 12;
                const awaitCompositionEnd = () => {
                    if (!isComposing || remainingCompositionChecks <= 0) {
                        isComposing = false;
                        emitCommitSnapshot(safeRequestId);
                        return;
                    }
                    remainingCompositionChecks -= 1;
                    window.setTimeout(awaitCompositionEnd, 16);
                };
                window.setTimeout(awaitCompositionEnd, 16);
            }

            function pushUpdate(options = {}) {
                if (isReadOnly || suppressPush) {
                    return;
                }
                const shouldNormalize = !!options.normalize;
                const shouldRunImmediately = !!options.immediate;
                const requestedDelay = typeof options.debounce === 'number' ? options.debounce : 180;
                pendingPushRequested = true;
                pendingPushNormalize = pendingPushNormalize || shouldNormalize;
                pendingPushImmediate = pendingPushImmediate || shouldRunImmediately;
                pendingPushDelay = pendingPushImmediate ? 0 : Math.min(pendingPushDelay, requestedDelay);
                if (isComposing) {
                    return;
                }
                window.clearTimeout(pushTimer);
                pushTimer = window.setTimeout(
                    flushPendingPush,
                    pendingPushImmediate ? 0 : pendingPushDelay
                );
            }

            function setTheme(accent, placeholder, background, card, text, sub, line, soft) {
                document.documentElement.style.setProperty('--accent', accent || '#315cbe');
                document.documentElement.style.setProperty('--bg', background || '#f4f6fa');
                document.documentElement.style.setProperty('--card', card || '#ffffff');
                document.documentElement.style.setProperty('--text', text || '#202d43');
                document.documentElement.style.setProperty('--sub', sub || '#5e6e85');
                document.documentElement.style.setProperty('--line', line || '#dde4ee');
                document.documentElement.style.setProperty('--soft', soft || '#e6edff');
                editor.setAttribute('data-placeholder', placeholder || '');
                syncEmptyState();
            }

            function setReadOnly(readOnly) {
                isReadOnly = !!readOnly;
                editor.setAttribute('contenteditable', isReadOnly ? 'false' : 'true');
                editor.setAttribute('spellcheck', isReadOnly ? 'false' : 'true');
                editor.setAttribute('aria-readonly', isReadOnly ? 'true' : 'false');
                if (isReadOnly) {
                    editor.blur();
                    setEditorFocusState(false);
                }
            }

            function setHtml(html) {
                suppressPush = true;
                editor.replaceChildren(sanitizedIncomingFragment(html));
                normalizeMarkup();
                savedSelection = null;
                lastPushedHtml = '';
                lastPushedPlainText = '';
                suppressPush = false;
                pushUpdate({ normalize: false, immediate: true });
            }

            function toggleBlockFormat(tagName) {
                const block = closestBlock(window.getSelection().anchorNode);
                const currentTag = block && block.tagName ? block.tagName.toLowerCase() : '';
                document.execCommand('formatBlock', false, currentTag === tagName ? 'p' : tagName);
            }

            function toggleCenter() {
                const block = closestBlock(window.getSelection().anchorNode);
                if (!block) {
                    return;
                }
                if (block.dataset.align === 'center') {
                    delete block.dataset.align;
                } else {
                    block.dataset.align = 'center';
                }
            }

            function markTodoList(list) {
                if (!list) {
                    return;
                }
                list.dataset.noteTodo = 'true';
                Array.from(list.children).forEach((item) => {
                    if (item.tagName && item.tagName.toLowerCase() === 'li' && !item.dataset.done) {
                        item.dataset.done = 'false';
                    }
                });
            }

            function insertTodoList() {
                document.execCommand('insertUnorderedList');
                const selection = window.getSelection();
                const list = closestList(selection.anchorNode);
                markTodoList(list);
            }

            function toggleTodoState() {
                let item = closestTodoItem(window.getSelection().anchorNode);
                if (!item) {
                    insertTodoList();
                    return;
                }
                if (item) {
                    item.dataset.done = item.dataset.done === 'true' ? 'false' : 'true';
                }
            }

            function toggleTodoItem(item) {
                if (!item) {
                    return;
                }
                item.dataset.done = item.dataset.done === 'true' ? 'false' : 'true';
                normalizeMarkup();
                syncEmptyState();
                pushUpdate({ immediate: true });
            }

            function todoCheckboxHit(event) {
                const item = closestTodoItem(event.target);
                if (!item) {
                    return null;
                }
                const rect = item.getBoundingClientRect();
                const hitWidth = 34;
                const x = event.clientX || 0;
                const y = event.clientY || 0;
                const withinY = y >= rect.top && y <= rect.bottom;
                return withinY && x >= rect.left && x <= rect.left + hitWidth ? item : null;
            }

            function insertImage(attachmentId, description) {
                if (isReadOnly || !attachmentId) {
                    return;
                }
                focusEditor();
                const selection = window.getSelection();
                const anchorNode = selection && selection.rangeCount > 0 ? selection.anchorNode : null;
                const currentBlock = closestBlock(anchorNode) || ensureTrailingEditableBlock();
                const figure = buildImageFigure(attachmentId, description);
                if (currentBlock && currentBlock.parentNode === editor) {
                    const insertAfter = currentBlock.nextSibling;
                    if (insertAfter) {
                        editor.insertBefore(figure, insertAfter);
                    } else {
                        editor.appendChild(figure);
                    }
                } else {
                    editor.appendChild(figure);
                }
                let caretBlock = null;
                const nextElement = figure.nextSibling && figure.nextSibling.nodeType === Node.ELEMENT_NODE
                    ? figure.nextSibling
                    : null;
                const nextTag = nextElement && nextElement.tagName ? nextElement.tagName.toLowerCase() : '';
                if (nextElement && blockTags.has(nextTag) && nextTag !== 'figure') {
                    caretBlock = nextElement;
                } else {
                    caretBlock = createTrailingParagraph();
                    if (figure.nextSibling) {
                        editor.insertBefore(caretBlock, figure.nextSibling);
                    } else {
                        editor.appendChild(caretBlock);
                    }
                }
                normalizeMarkup();
                placeCaretAtStart(caretBlock);
                scheduleCaretIntoView();
                pushUpdate({ immediate: true });
            }

            function applyCommand(command) {
                if (isReadOnly) {
                    return;
                }
                focusEditor();
                switch (command) {
                    case 'heading':
                        toggleBlockFormat('h2');
                        break;
                    case 'center':
                        toggleCenter();
                        break;
                    case 'bullet':
                        document.execCommand('insertUnorderedList');
                        break;
                    case 'bold':
                        document.execCommand('bold');
                        break;
                    case 'quote':
                        toggleBlockFormat('blockquote');
                        break;
                    case 'todo':
                        insertTodoList();
                        break;
                    case 'ordered':
                        document.execCommand('insertOrderedList');
                        break;
                    case 'toggleTodoState':
                        toggleTodoState();
                        break;
                    default:
                        break;
                }
                normalizeMarkup();
                rememberSelection();
                scheduleCaretIntoView();
                pushUpdate({ immediate: true });
            }

            editor.addEventListener('beforeinput', rememberSelection);
            editor.addEventListener('click', (event) => {
                if (isReadOnly) {
                    return;
                }
                const item = todoCheckboxHit(event);
                if (!item) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                toggleTodoItem(item);
            });
            editor.addEventListener('compositionstart', () => {
                isComposing = true;
                rememberSelection();
            });
            editor.addEventListener('compositionend', () => {
                isComposing = false;
                rememberSelection();
                scheduleCaretIntoView();
                pushUpdate({ immediate: true });
            });
            editor.addEventListener('input', (event) => {
                rememberSelection();
                scheduleCaretIntoView();
                const inputType = event && event.inputType ? event.inputType : '';
                const shouldPushImmediately =
                    inputType === 'insertParagraph' ||
                    inputType === 'insertLineBreak';
                pushUpdate({
                    debounce: shouldPushImmediately ? 0 : 180,
                    immediate: shouldPushImmediately
                });
            });
            editor.addEventListener('blur', () => {
                setEditorFocusState(false);
                rememberSelection();
                pushUpdate({ normalize: true, immediate: true });
            });
            editor.addEventListener('focus', () => {
                setEditorFocusState(true);
                rememberSelection();
                syncEmptyState();
                scheduleCaretIntoView();
            });
            editor.addEventListener('keyup', rememberSelection);
            editor.addEventListener('mouseup', () => {
                rememberSelection();
                scheduleCaretIntoView();
            });
            editor.addEventListener('touchend', () => {
                window.setTimeout(() => {
                    rememberSelection();
                    scheduleCaretIntoView();
                }, 0);
            });
            document.addEventListener('selectionchange', () => {
                if (selectionInsideEditor(window.getSelection())) {
                    rememberSelection();
                    scheduleCaretIntoView();
                }
            });
            window.addEventListener('resize', scheduleCaretIntoView);
            frame.addEventListener('click', (event) => {
                if (!isReadOnly && event.target === frame) {
                    focusEditor();
                }
            });
            editor.addEventListener('paste', (event) => {
                if (isReadOnly) {
                    event.preventDefault();
                    return;
                }
                event.preventDefault();
                const text = (event.clipboardData || window.clipboardData).getData('text/plain');
                document.execCommand('insertText', false, text);
                pushUpdate({ normalize: true, immediate: true });
            });
            editor.addEventListener('drop', (event) => {
                event.preventDefault();
            });

            window.SmartisanRichText = {
                applyCommand,
                insertImage,
                focusEditor,
                requestCommitSnapshot,
                setHtml,
                setReadOnly,
                setTheme
            };

            setEditorFocusState(false);
            setReadOnly(true);
            editor.setAttribute('data-placeholder', '');
            setHtml('');
        })();
    </script>
</body>
</html>
