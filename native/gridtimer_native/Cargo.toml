# v2.22.46 - Add opt-in native window visual review dependencies.
# v2.22.25 - Require the Rust version used by the Windows release safety pipeline.
[package]
name="gridtimer_native"
version="0.0.0"
edition="2021"
rust-version="1.95"
[lib]
crate-type=["cdylib","rlib"]
doctest=false
[features]
desktop=["dep:eframe","dep:wry","dep:windows_platform"]
[dependencies]
argon2={version="0.5.3",features=["std"]}
base64="0.22.1"
jni="0.21.1"
indexmap={version="2.13.1",features=["serde"]}
pulldown-cmark="0.13.0"
rand="0.8.5"
ring="0.17.14"
flate2="1.1.9"
zip={version="2.2",default-features=false,features=["deflate"]}
pdf-extract="0.10"
serde={version="1.0.228",features=["derive"]}
serde_ignored="0.1.14"
serde_json="1.0.145"
sha2="0.10.8"
ureq={version="2.12.1",default-features=false,features=["tls"]}
url="2.5.8"
zeroize="1.8.2"
eframe={version="0.27.2",optional=true,default-features=false,features=["default_fonts","glow","accesskit"]}

[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite={version="0.40.1",default-features=false,features=["backup","bundled"]}

[profile.release]
strip="symbols"

[dev-dependencies]
image={version="0.24.9",default-features=false,features=["png"]}
winit={version="0.29.15",default-features=false}

[[bin]]
name="timer_windows_client"
path="src/bin/timer_windows_client.rs"
required-features=["desktop"]

[[bin]]
name="timer_sync_server"
path="src/bin/timer_sync_server.rs"

[[bin]]
name="timer_sync_launcher"
path="src/bin/timer_sync_launcher.rs"

[target.'cfg(target_os = "windows")'.dependencies]
wry={version="0.56.1",optional=true,default-features=false,features=["os-webview"]}
windows_platform={package="windows",version="0.62.2",optional=true,features=["Win32_Foundation","Win32_Media_Audio","Win32_Media_MediaFoundation","Win32_Media_Speech","Win32_System_Com","Win32_System_Ole","Win32_System_Variant","Win32_System_Threading","Win32_Storage_FileSystem"]}
